name: shell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: bash -n on all shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every .sh
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "FAIL: $f"
              fail=1
            fi
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$fail"

  bridge-render:
    name: chat-bridge template byte-equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/bridge-render.sh
        run: ./tests/bridge-render.sh

  opencode-wrapper-removal:
    name: opencode wrapper removal regression (#117)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/opencode-wrapper-removal.sh
        run: ./tests/opencode-wrapper-removal.sh

  datamachine-kimaki-adapter:
    name: Data Machine Kimaki adapter regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/datamachine-kimaki-adapter.sh
        run: ./tests/datamachine-kimaki-adapter.sh

  kimaki-native-cwd-routing:
    name: Kimaki native cwd routing regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/kimaki-native-cwd-routing.sh
        run: ./tests/kimaki-native-cwd-routing.sh
      - name: Run tests/kimaki-no-sqlite-session-writes.sh
        run: ./tests/kimaki-no-sqlite-session-writes.sh
