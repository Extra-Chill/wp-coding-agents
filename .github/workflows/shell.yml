name: shell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: bash -n on all shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every .sh
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ! bash -n "$f"; then
              echo "FAIL: $f"
              fail=1
            fi
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          exit "$fail"

  dead-mechanism:
    name: every mechanism has a live consumer (#601)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/dead-mechanism.sh
        run: ./tests/dead-mechanism.sh

  duplicate-mechanism:
    name: one mechanism, one implementation (#601)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/duplicate-mechanism.sh
        run: ./tests/duplicate-mechanism.sh

  escaping-helpers:
    name: shared JSON and XML escaping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/escaping-helpers.sh
        run: ./tests/escaping-helpers.sh

  plist-rendering:
    name: launchd plists are well-formed XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/plist-rendering.sh
        run: ./tests/plist-rendering.sh

  bridge-render:
    name: chat-bridge template byte-equivalence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/bridge-render.sh
        run: ./tests/bridge-render.sh

  privilege-grants:
    name: privilege grants validate before install (#601)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/privilege-grants.sh
        run: ./tests/privilege-grants.sh

  opencode-claude-auth-retired:
    name: opencode-claude-auth stays retired (#117)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/opencode-claude-auth-retired.sh
        run: ./tests/opencode-claude-auth-retired.sh

  opencode-subagents:
    name: Data Machine graph OpenCode subagents (#355)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/opencode-subagents.sh
        run: bash tests/opencode-subagents.sh
      - name: Run tests/opencode-runtime-install.sh
        run: bash tests/opencode-runtime-install.sh

  opencode-general-dispatch:
    name: bounded OpenCode general dispatch (#453)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install supported OpenCode fixture
        run: npm install --global opencode-ai@1.18.20
      - name: Run tests/opencode-general-dispatch.sh
        run: bash tests/opencode-general-dispatch.sh

  retired-skills:
    name: retired managed skills are removed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/retired-skills.sh
        run: ./tests/retired-skills.sh

  dm-agent-sync:
    name: Data Machine agent sync plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run tests/dm-agent-sync.mjs
        run: bun tests/dm-agent-sync.mjs
      - name: Run tests/session-attribution.mjs
        run: bun tests/session-attribution.mjs
      - name: Run tests/setup-profile-compiler.mjs
        run: node tests/setup-profile-compiler.mjs

  cli-transport:
    name: CLI dispatch transport runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/cli-transport-install.sh
        run: ./tests/cli-transport-install.sh
      - name: Run tests/wp-cli-transport-resolution.sh
        run: ./tests/wp-cli-transport-resolution.sh
      - name: Run tests/smoke-cli-transport.php
        run: php tests/smoke-cli-transport.php

  wordpress-integration-package:
    name: WordPress integration package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/wordpress-integration-package.php
        run: php -d zend.assertions=1 -d assert.exception=1 tests/wordpress-integration-package.php

  inbound-event-bridge:
    name: durable inbound event bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/inbound-event-bridge.sh
        run: bash tests/inbound-event-bridge.sh
      - name: Run tests/smoke-inbound-event-bridge.php
        run: php tests/smoke-inbound-event-bridge.php
      - name: Run tests/inbound-event-connector.py
        run: python3 tests/inbound-event-connector.py

  cli-channel-registry:
    name: CLI channel registry permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/cli-channel-perms.sh
        run: ./tests/cli-channel-perms.sh

  ai-gateway:
    name: WP AI Gateway opt-in regression (#173)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/ai-gateway.sh
        run: ./tests/ai-gateway.sh

  cli-channel-binary-path:
    name: Roadie CLI channel reachable by the web user (#198)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/cli-channel-binary-path.sh
        run: ./tests/cli-channel-binary-path.sh

  wp-codebox-subtree:
    name: WP Codebox subtree updater
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/wp-codebox-subtree.sh
        run: ./tests/wp-codebox-subtree.sh

  service-identity-adoption:
    name: Service identity adoption regression (#204)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/service-identity-adoption.sh
        run: ./tests/service-identity-adoption.sh

  roadie-managed-env:
    name: Roadie managed env in every render site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/roadie-managed-env.sh
        run: ./tests/roadie-managed-env.sh

  runtime-guard:
    name: runtime deactivation guard (#328)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/runtime-guard.sh
        run: ./tests/runtime-guard.sh

  source-mode:
    name: installed-source mode (#314, #324)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/source-mode.sh
        run: ./tests/source-mode.sh

  service-identity-defaults:
    name: owned mode defaults to non-root (#327)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/service-identity-defaults.sh
        run: ./tests/service-identity-defaults.sh

  service-migration:
    name: root -> non-root service identity migration (#93)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/service-migration.sh
        run: ./tests/service-migration.sh

  agents-md-guidance:
    name: AGENTS.md guidance registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/agents-md-guidance.sh
        run: ./tests/agents-md-guidance.sh
      - name: Run tests/agents-md-composition-integration.sh
        run: bash tests/agents-md-composition-integration.sh
      - name: Run tests/opencode-local-plugin-path.sh
        run: ./tests/opencode-local-plugin-path.sh
      - name: Run tests/repair-opencode-json.sh
        run: ./tests/repair-opencode-json.sh
      - name: Run tests/claude-code-permissions.sh
        run: ./tests/claude-code-permissions.sh
      - name: Run tests/codex-permissions.sh
        run: ./tests/codex-permissions.sh

  claude-code-hook-scope:
    name: Claude Code hook agent scoping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/claude-code-hook-scope.sh
        run: ./tests/claude-code-hook-scope.sh

  # Suites that had no CI job until #335. Run as a matrix so adding a test is a
  # one-line change and tests/ci-coverage.sh stays satisfied; invoked through
  # `bash` because several of these files do not carry the executable bit.
  suites:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - agent-state-ownership
          - webroot-backup-hygiene
          - agents-md-failure-does-not-abort-upgrade
          - agents-md-compose-site-owner
          - carried-claude-code-plugin
          - ci-coverage
          - codex-runtime
          - datamachine-worker
          - detect-php-version
          - detect-site-domain
          - dmc-migration-inventory
          - external-wordpress-runtime
          - homeboy-codebox-canary
          - homeboy-components
          - homeboy-project-id
          - homeboy-service-identity
          - homeboy-daemon-service
          - homeboy-verification-guidance
          - roadie-accounts
          - roadie-application-config
          - roadie-command-guard
          - roadie-fork-workspace
          - roadie-wordpress-context
          - roadie-kimaki-migration
          - roadie-multi-instance
          - roadie-provision
          - refresh-roadie-pin
          - roadie-retire-kimaki
          - self-upgrade
          - installation-profile
          - install-source-integrity-report
          - install-source-managed-file-sync
          - opencode-claude-auth-refresh-hardening
          - opencode-subagents-optional
          - owned-source-discovery
          - source-reconcile
          - systems-capabilities
          - codebox-database
          - codebox-database-env-wiring
          - composer-provision
          - upgrade-help
          - verify
          - path-helpers
          - plugins-only-scope
          - plugin-upgrade-bounds
          - runtime-signature
          - runtime-guidance-desired-state
          - convergence-orchestrator
          - bridge-service-adapters
          - integration-adapters
          - upgrade-opencode-auth-plugin-sync
          - wordpress-service
          - worktree-context-projections
          - workspace-installation
          - workspace-materialization
          - wp-cli-machine-output
          - wp-config-permissions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.test == 'opencode-claude-auth-refresh-hardening' || matrix.test == 'roadie-command-guard' || matrix.test == 'roadie-accounts' || matrix.test == 'roadie-fork-workspace'
        with:
          node-version: 24
      - name: Install verified Homeboy workspace fixture
        if: matrix.test == 'roadie-fork-workspace'
        run: curl -fsSL https://github.com/Extra-Chill/homeboy/releases/download/v0.399.35/homeboy-installer.sh | sh
      - name: Install supported OpenCode dispatch fixture
        if: matrix.test == 'roadie-command-guard'
        run: npm install --global opencode-ai@1.18.20
      - name: Install sqlite3 for the Kimaki migration test
        if: matrix.test == 'roadie-kimaki-migration'
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Run tests/${{ matrix.test }}.sh
        run: bash tests/${{ matrix.test }}.sh
