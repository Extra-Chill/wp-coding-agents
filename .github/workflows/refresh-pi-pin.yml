name: Refresh Pi pin

# Hosts install the Pi release pinned in bridges/roadie/pi-version as Roadie's
# agent backend, so every install from one commit gets the same Pi. This keeps
# the pin on Pi's newest release within its major version; a new major is
# refused by scripts/refresh-pi-pin.sh and moved by hand.
#
# A refresh lands on main directly once the Pi install tests pass with the new
# pin. Hosts pick it up on their next upgrade.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pi-pin
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve Pi's newest release
        id: pin
        run: |
          set -euo pipefail
          before="$(tr -d '[:space:]' < bridges/roadie/pi-version)"
          after="$(./scripts/refresh-pi-pin.sh)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "::notice::Pi pin is current at $before."
          fi

      # Pushes made with the workflow token do not trigger the shell workflow,
      # so the tests that read the pin run here before anything lands.
      - name: Test the new pin
        if: steps.pin.outputs.before != steps.pin.outputs.after
        run: |
          set -euo pipefail
          bash tests/roadie-pi-backend.sh
          npm view "@earendil-works/pi-coding-agent@${{ steps.pin.outputs.after }}" bin.pi | grep -q .

      - name: Commit the new pin
        if: steps.pin.outputs.before != steps.pin.outputs.after
        env:
          VERSION: ${{ steps.pin.outputs.after }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bridges/roadie/pi-version
          git commit -m "chore(roadie): pin Pi v${VERSION}"
          git push origin HEAD:main
