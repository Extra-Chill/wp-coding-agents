name: Refresh Roadie pin

# Hosts install the Roadie release pinned in bridges/roadie/roadie-version, so
# every install from one commit gets the same Roadie. This keeps the pin on
# Roadie's newest release without anyone editing it. Roadie does not notify
# this repository; this workflow asks, hourly and on demand.
#
# A refresh lands on main directly once the Roadie install and boot tests pass
# with the new pin. Hosts pick it up on their next upgrade
# (`/upgrade-and-restart`); nothing here restarts a running bridge.
#
# A release whose range carries a breaking change never pushes to main: the
# refresh opens a PR instead (#731), so installer changes can land with the
# pin and someone reviews the startup-contract implications before hosts
# self-upgrade into a crash loop.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-roadie-pin
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve Roadie's newest release
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before="$(tr -d '[:space:]' < bridges/roadie/roadie-version)"
          after="$(./scripts/refresh-roadie-pin.sh)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "::notice::Roadie pin is current at $before."
          fi

      # Pushes made with the workflow token do not trigger the shell workflow,
      # so the tests that read the pin run here before anything lands.
      - uses: actions/setup-node@v4
        if: steps.pin.outputs.before != steps.pin.outputs.after
        with:
          node-version: 24

      - name: Test the new pin
        if: steps.pin.outputs.before != steps.pin.outputs.after
        run: |
          set -euo pipefail
          bash tests/roadie-provision.sh

      # The provision test never starts the service; this does (#731). A
      # release that exits before backend resolution or database
      # initialization — a usage or config error at startup — fails here
      # instead of crash-looping every self-upgrading host.
      - name: Boot the new pin
        if: steps.pin.outputs.before != steps.pin.outputs.after
        run: bash tests/roadie-boot-smoke.sh

      # Breaking releases go through review instead of main.
      - name: Detect a breaking release
        id: breaking
        if: steps.pin.outputs.before != steps.pin.outputs.after
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ./scripts/roadie-release-breaking.sh \
              "${{ steps.pin.outputs.before }}" "${{ steps.pin.outputs.after }}"; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the new pin
        if: steps.pin.outputs.before != steps.pin.outputs.after
        env:
          VERSION: ${{ steps.pin.outputs.after }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bridges/roadie/roadie-version
          git commit -m "chore(roadie): pin v${VERSION}"

      # Non-breaking: land on main as before; hosts pick it up on upgrade.
      - name: Push the new pin to main
        if: steps.pin.outputs.before != steps.pin.outputs.after && steps.breaking.outputs.breaking != 'true'
        run: git push origin HEAD:main

      # Breaking: a PR, so installer changes land with the pin and a human
      # reviews the startup contract before hosts self-upgrade (#731).
      - name: Open a PR for the breaking release
        if: steps.pin.outputs.before != steps.pin.outputs.after && steps.breaking.outputs.breaking == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.after }}
          BRANCH: refresh-roadie-pin/v${{ steps.pin.outputs.after }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          # A refresh retries hourly; an earlier attempt may already own the
          # branch (and its PR), so replace the branch instead of rejecting.
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "::notice::PR for $BRANCH is already open; branch refreshed."
            exit 0
          fi
          {
            echo "Roadie's release range v${{ steps.pin.outputs.before }}...v${VERSION} carries a breaking change, so the pin moves through review instead of main (#731).";
            echo;
            echo 'Detected as breaking by `scripts/roadie-release-breaking.sh`:';
            echo '```';
            ./scripts/roadie-release-breaking.sh "${{ steps.pin.outputs.before }}" "$VERSION" || true;
            echo '```';
            echo;
            echo 'Both gates passed (provision + boot smoke), so the release starts, but the startup contract may have shifted. Land any installer changes with this pin.';
          } > body.md
          if ! gh pr create \
            --title "chore(roadie): pin v${VERSION} (breaking)" \
            --body-file body.md \
            --base main \
            --head "$BRANCH"; then
            echo "::error::Could not open the pin PR. Branch $BRANCH is pushed; open it by hand, or enable 'Allow GitHub Actions to create and approve pull requests' for this repository."
            exit 1
          fi
